<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Popotovanja | Miha & Matej</title>

    <meta name="description"
        content="Popotovanja Mihe in Mateja – skupne poti, zgodbe in digitalni roadbooki.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#17395B">
    <link rel="apple-touch-icon"
      href="images/pwa/apple-touch-icon.png">
      
    <link rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/pwa/icon-32.png">

    <link rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/pwa/icon-16.png">
</head>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js")
        .then(registration => {
          console.log(
            "Roadbook service worker registriran:",
            registration.scope
          );
        })
        .catch(error => {
          console.error(
            "Registracija service workerja ni uspela:",
            error
          );
        });
    });
  }
</script>

<body>

    <main class="page">

        <!-- ==========================================
             HERO
        =========================================== -->

        <section class="hero text-center">

            <img
                src="images/brand/miha-matej-logo.png"
                alt="Logotip Miha & Matej"
                class="brand-logo">

            <h1 class="site-title">
                Popotovanja
            </h1>

            <p class="site-tagline">
                MIHA &amp; MATEJ
            </p>

            <p class="site-since">
                skupne poti in zgodbe ~ od leta 2011               
            </p>

        </section>

        <!-- ==========================================
             ROADBOOKS
        =========================================== -->

        <section class="container roadbook-grid">

            <a href="roadbooks/balkan-2026/index.html"
                class="roadbook-card">

                <div class="card-image"></div>

                <div class="card-content">

                    <p class="card-label">
                        1.–16. avgust 2026
                    </p>

                    <h2 class="card-title">
                        Balkan Roadtrip 2026
                    </h2>

                    <p class="card-description">
                        Slovenija • Hrvaška • Bosna in Hercegovina • Črna gora
                    </p>

                    <span class="button">
                        Odpri roadbook →
                    </span>

                </div>

            </a>

        </section>

    </main>

</body>

</html>
